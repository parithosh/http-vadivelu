server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and owns the security headers (secure-headers
    # middleware), so nothing of that sort here.
    server_tokens off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The documented API: /gif/200 and /jpg/404 answer with the image itself,
    # no extension. This is the whole trick the upstream README credits to its
    # Apache config, and what the src/routes/[...slug].ts endpoint faked by
    # proxying vadivelu.anoram.com. Done here it needs no origin and no
    # server-side JS. GIFs win, then the JPG of the same code, per the README.
    location ~ ^/gif/([1-5][0-9][0-9])$ {
        try_files /gif/$1.gif /jpg/$1.jpg =404;
    }

    location ~ ^/jpg/([1-5][0-9][0-9])$ {
        try_files /jpg/$1.jpg =404;
    }

    # Hashed build output — safe to cache hard.
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(gif|jpe?g|png|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
